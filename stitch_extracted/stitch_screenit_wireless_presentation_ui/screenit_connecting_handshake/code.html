<script>
    (function() {
      const node = document.getElementById('traveling-node');
      let start = null;
      const duration = 1600;

      function step(timestamp) {
        if (!start) start = timestamp;
        const progress = ((timestamp - start) % duration) / duration;
        const cx = 15 + (progress * 170);
        if (node) {
          node.setAttribute('cx', cx.toString());
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);

      const cancelBtn = document.getElementById('cancel-connection-btn');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', function() {
          const statusText = document.getElementById('status-ticker');
          if (statusText) {
            statusText.textContent = 'Cancelling connection...';
          }
          cancelBtn.classList.add('opacity-50', 'pointer-events-none');
          setTimeout(() => {
            window.location.reload();
          }, 600);
        });
      }
    })();
  </script>
